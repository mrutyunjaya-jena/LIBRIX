name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        run: npm run build:android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/librix-${{ github.ref_name }}.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: release/librix-${{ github.ref_name }}.apk
          generate_release_notes: true
          name: LIBRIX ${{ github.ref_name }}
          body: |
            ## 🚀 LIBRIX ${{ github.ref_name }} Release
            
            Universal Local-First Knowledge Vault, Multi-Format Reader (PDF, EPUB, Markdown), Notion-Style Block Notes & Google Drive Cloud Sync.
            
            ### 📱 Download Android APK
            - **[librix-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/librix-${{ github.ref_name }}.apk)** (Android 13 - 17+ Supported)
